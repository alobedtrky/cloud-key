<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071018"><title>تسجيل الدخول | Cloud Key</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/account.css"></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">CK</span><span><strong>Cloud Key</strong><small>كلاود كي</small></span></a><a class="secondary-btn" href="/">العودة للمتجر</a></header><main class="account-page"><section class="account-card"><span class="eyebrow">حساب Cloud Key</span><h1>تسجيل الدخول</h1><p class="account-note">ادخل بحساب Google أو رقم الجوال للوصول إلى ملفك الشخصي.</p><button id="googleLogin" class="google-btn"><span>G</span> المتابعة باستخدام Google</button><div class="divider"><span>أو</span></div><div id="phoneStep"><label>رقم الجوال</label><div class="phone-row"><input id="phone" inputmode="tel" placeholder="05xxxxxxxx"><button id="sendCode" class="primary-btn">إرسال الرمز</button></div><p class="account-help">سيتم إرسال رمز تحقق SMS. قد تُطبق رسوم الرسائل المعتادة.</p><div id="recaptcha-container"></div></div><div id="codeStep" class="hidden"><label>رمز التحقق</label><input id="code" inputmode="numeric" maxlength="6" placeholder="000000"><button id="verifyCode" class="primary-btn full">تأكيد وتسجيل الدخول</button><button id="changePhone" class="link-btn">تغيير رقم الجوال</button></div><div id="authMessage" class="account-message"></div></section></main><script type="module" src="/login.js"></script></body></html>
