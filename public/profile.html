<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071018"><title>حسابي | Cloud Key</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/account.css"></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">CK</span><span><strong>Cloud Key</strong><small>كلاود كي</small></span></a><div class="header-actions"><a class="secondary-btn" href="/">المتجر</a><button id="logout" class="secondary-btn">تسجيل الخروج</button></div></header><main class="profile-page"><section id="loadingProfile" class="account-card"><p>جاري تحميل حسابك...</p></section><section id="profileCard" class="profile-shell hidden"><div class="profile-hero"><div class="avatar-wrap"><img id="avatar" alt="الصورة الشخصية"><span id="avatarFallback">CK</span></div><div><span class="eyebrow">حساب العميل</span><h1 id="displayName">عميل Cloud Key</h1><p id="identityLine" class="account-note"></p></div></div><div class="profile-grid"><article class="profile-box"><h3>بيانات الحساب</h3><label>الاسم<input id="nameInput" maxlength="60" placeholder="اسمك"></label><label>البريد الإلكتروني<input id="emailInput" disabled></label><label>رقم الجوال<input id="phoneInput" disabled></label><button id="saveProfile" class="primary-btn">حفظ الاسم</button><p id="profileMessage" class="account-message"></p></article><article class="profile-box"><h3>معلومات العضوية</h3><div class="info-row"><span>طريقة الدخول</span><b id="provider"></b></div><div class="info-row"><span>حالة الحساب</span><b>مفعّل</b></div><div class="info-row"><span>معرّف العميل</span><code id="uid"></code></div><p class="account-help">طلباتك السا
