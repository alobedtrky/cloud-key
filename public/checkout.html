<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إتمام الطلب | Cloud Key</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/v4.css"><link rel="stylesheet" href="/motion.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/moyasar-payment-form@2.2.10/dist/moyasar.css"><style>.checkout-page{max-width:1120px;margin:auto;padding:55px 22px 90px}.checkout-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:25px}.steps{display:flex;gap:8px;flex-wrap:wrap}.step{padding:8px 11px;border:1px solid var(--border);border-radius:99px;color:var(--muted);font-size:12px}.step.on{background:#123341;color:#aef3ff;border-color:#2d6679}.checkout-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.ck-card{background:#09151e;border:1px solid var(--border);border-radius:22px;padding:22px}.ck-card h2{margin:0 0 18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fields label{display:grid;gap:6px;color:#b8cad5;font-size:13px}.fields input{padding:13px;border-radius:12px;border:1px solid var(--border);background:#061018;color:#fff}.full{grid-column:1/-1}.summary-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}.summary-item img{width:70px;height:52px;object-fit:cover;border-radius:10px}.summary-item b{display:block}.summary-item small{color:var(--muted)}.summary-total{display:flex;justify-content:space-between;font-size:20px;margin-top:18px}.checkout-msg{margin:14px 0;color:#9fb8c5;line-height:1.7}.payment-box{margin-top:18px;display:none}.payment-box.show{display:block}.mysr-form{direction:ltr}.empty-state{padding:45px;text-align:center}@media(max-width:800px){.checkout-grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.full{grid-column:auto}.checkout-head{align-items:flex-start;flex-direction:column}}</style></head><body><div class="announcement">Cloud Key — إتمام الطلب بشكل آمن</div><header class="site-header"><a class="brand" href="/"><span class="brand-mark">CK</span><span><strong>Cloud Key</strong><small>كلاود كي</small></span></a><div class="header-actions"><a class="secondary-btn" href="/">العودة للمتجر</a><a class="secondary-btn" data-account-link href="/profile">حسابي</a></div></header><main class="checkout-page"><div class="checkout-head"><div><span class="eyebrow">CHECKOUT</span><h1>إتمام الطلب</h1></div><div class="steps"><span class="step on">1 السلة</span><span class="step on">2 البيانات</span><span class="step">3 الدفع</span><span class="step">4 تم</span></div></div><div id="checkoutEmpty" class="ck-card empty-state" hidden>السلة فارغة. <a href="/">العودة للمنتجات</a></div><div id="checkoutGrid" class="checkout-grid"><section><div class="ck-card"><h2>بيانات العميل</h2><div class="fields"><label>الاسم<input id="coName" maxlength="100" required></label><label>البريد الإلكتروني<input id="coEmail" type="email" maxlength="150"></label><label class="full">رقم الجوال<input id="coPhone" inputmode="tel" placeholder="05xxxxxxxx" required></label></div><p class="checkout-msg">سيتم ربط الطلب بحسابك المسجل، وبعد إنشاء الطلب يظهر لك رقم فريد للمتابعة.</p><button id="createOrder" class="primary-btn full" style="width:100%">إنشاء الطلب والمتابعة للدفع</button></div><div id="paymentBox" class="ck-card payment-box"><h2>الدفع الإلكتروني</h2><p id="paymentNote" class="checkout-msg"></p><div class="mysr-form"></div></div></section><aside class="ck-card"><h2>ملخص الطلب</h2><div id="summaryItems"></div><div class="summary-total"><span>الإجمالي</span><strong id="summaryTotal">0 ر.س</strong></div></aside></div></main><div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/moyasar-payment-form@2.2.10/dist/moyasar.umd.min.js"></script><script type="module" src="/checkout.js"></script><script src="/motion.js"></script></body></html>
